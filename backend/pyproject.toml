[project]
name = "repoiq-backend"
version = "0.1.0"
description = "FastAPI backend for RepoIQ"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
