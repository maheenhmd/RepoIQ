[project]
name = "repoiq-backend"
version = "0.1.0"
description = "FastAPI backend for RepoIQ"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "einops>=0.8,<0.9",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pgvector>=0.4,<0.5",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sentence-transformers>=3.4,<4",
  "sqlalchemy>=2.0,<3.0",
  "transformers>=4.48,<4.50",
  "tree-sitter-language-pack==0.13.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
reranker = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<0.22", "numpy>=1.26,<3", "psutil>=6,<8"]
